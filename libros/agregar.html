<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Libro</title>
    <link href="../css/styles.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <form class="col-4 p-3 m-auto" id="addBookForm">
        <h2 class="section-heading text-uppercase text-center mb-3 mt-4">Agregar Libro</h2>
        <div class="mb-3"><input type="text" class="form-control" name="id_titulo" placeholder="ID titulo" required></div>
        <div class="mb-3"><input type="text" class="form-control" name="titulo" placeholder="Titulo del libro" required></div>
        <div class="mb-3"><input type="text" class="form-control" name="tipo" placeholder="Tipo de libro" required></div>
        <div class="mb-3"><input type="number" class="form-control" name="id_pub" placeholder="ID publicacion" required></div>
        <div class="mb-3"><input type="number" step="0.01" class="form-control" name="precio" placeholder="Precio del libro" required></div>
        <div class="mb-3"><input type="number" step="0.01" class="form-control" name="avance" placeholder="Avance de dinero" required></div>
        <div class="mb-3"><input type="number" class="form-control" name="total_ventas" placeholder="Total de ventas" required></div>
        <div class="mb-3"><input type="text" class="form-control" name="notas" placeholder="Notas del libros" required></div>
        <div class="mb-3"><input type="date" class="form-control" name="fecha_pub" placeholder="Fecha de publicacion" required></div>
        <div class="mb-3"><input type="number" class="form-control" name="contrato" placeholder="¿Tiene contrato?" required></div>
        <div class="text-center mb-3">
            <button type="submit" class="btn btn-primary">Agregar</button>
            <a href="index.html" class="btn btn-secondary">Volver</a>
        </div>
    </form>
    <script>
        document.getElementById('addBookForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Libro agregado. (Simulado en versión estática)');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
